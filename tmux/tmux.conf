# Reload Config file
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded."

# CTRL + J and CTRL + F as prefix
set-option -g prefix C-f
set-option -g prefix2 C-j

# Alt-Vim Keys without prefix to switch panes 
bind -n M-l select-pane -R
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-h select-pane -L

# Splitting Windows
bind-key v split-window -h
bind-key h split-window -v

# Shift-Arrow Keys to switch windows
bind -n S-Right next-window
bind -n S-Left previous-window

# Reorder Windows with CTRL+SHIFT+ARROW
bind-key -n C-Left swap-window -t -1
bind-key -n C-Right swap-window -t +1

# Synchronize Panes
bind-key y set-window-option synchronize-panes \; display-message "synchronized mode toggled."

# Mouse Mode
set -g mouse on
